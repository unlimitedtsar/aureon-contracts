[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aureon-contracts"
dynamic = ["version"]
description = "Canonical Data Contracts for the Aureon/Keystone ecosystem"
readme = "../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Keystone Team"}
]
dependencies = [
    "pydantic>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aureon_contracts*"]

[tool.setuptools_scm]
fallback_version = "0.0.0+local"
