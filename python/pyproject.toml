[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aureon-contracts"
version = "1.0.0"
description = "Canonical Data Contracts for the Aureon/Keystone ecosystem"
readme = "../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Keystone Team"}
]
dependencies = [
    "pydantic>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aureon_contracts*"]
