name: Aureon Contracts CI

on:
  push:
    branches: ["main", "staging"]
    paths:
      - "aureon_contracts/**"
  pull_request:
    branches: ["main"]
    paths:
      - "aureon_contracts/**"

permissions:
  contents: read

jobs:
  contracts-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pydantic setuptools setuptools-scm

      - name: Breaking change guard
        run: |
          python aureon_contracts/ci/check_breaking_changes.py

      - name: Schema-binding consistency guard
        run: |
          python aureon_contracts/ci/check_schema_binding_consistency.py

      - name: Build Python package
        run: |
          cd aureon_contracts/python
          pip install build
          python -m build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go compile check
        run: |
          cd aureon_contracts/go
          go test ./...

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust compile check
        run: |
          cd aureon_contracts/rust
          cargo check
